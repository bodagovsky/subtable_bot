name: Sync Config Vars to Heroku

# This workflow syncs GitHub Secrets to Heroku config vars
# Since Heroku is connected to GitHub and auto-deploys,
# we only need to sync config vars, not deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sync-config:
    runs-on: ubuntu-latest
    environment: production
    env:
      HEROKU_API_KEY: "${{ secrets.HEROKU_API_KEY }}"
    
    steps:
    - name: Install Heroku CLI
      run: |
        curl https://cli-assets.heroku.com/install.sh | sh
    
    - name: Set Telegram app config vars from GitHub Secrets
      run: |
        heroku config:set \
          OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
          WEBHOOK_URL="${{ secrets.WEBHOOK_URL }}" \
          WEBHOOK_PATH="${{ secrets.WEBHOOK_PATH || '/webhook' }}" \
          WEBHOOK_SECRET_TOKEN="${{ secrets.WEBHOOK_SECRET_TOKEN }}" \
          REDISCLOUD_URL="${{ secrets.REDISCLOUD_URL }}" \
          REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
          REDIS_PORT="${{ secrets.REDIS_PORT }}" \
          REDIS_USERNAME="${{ secrets.REDIS_USERNAME }}" \
          TELEGRAM_API_HASH="${{ secrets.TELEGRAM_API_HASH }}" \
          TELEGRAM_API_ID="${{ secrets.TELEGRAM_API_ID }}" \
          TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
          TELEGRAM_MCP_URL="${{ secrets.TELEGRAM_MCP_URL }}" \
          TELEGRAM_MCP_AUTH_TOKEN="${{ secrets.TELEGRAM_MCP_AUTH_TOKEN }}" \
          --app "${{ vars.HEROKU_TELEGRAM_APP_NAME }}"
    - name: Set MCP app config vars from GitHub Secrets
      run: |
        heroku config:set \
          HEROKU_SERVICE_ROLE=mcp \
          TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
          TELEGRAM_API_HASH="${{ secrets.TELEGRAM_API_HASH }}" \
          TELEGRAM_API_ID="${{ secrets.TELEGRAM_API_ID }}" \
          TELEGRAM_MCP_ALLOWED_CHAT_IDS="${{ secrets.TELEGRAM_MCP_ALLOWED_CHAT_IDS }}" \
          TELEGRAM_MCP_AUTH_TOKEN="${{ secrets.TELEGRAM_MCP_AUTH_TOKEN }}" \
          REDISCLOUD_URL="${{ secrets.REDISCLOUD_URL }}" \
          REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
          REDIS_PORT="${{ secrets.REDIS_PORT }}" \
          REDIS_USERNAME="${{ secrets.REDIS_USERNAME }}" \
          --app "${{ vars.HEROKU_MCP_APP_NAME }}"
